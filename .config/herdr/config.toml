onboarding = false
# Herdr — terminal workspace manager. Defaults plus the few lines below.
# Full default config: `herdr --default-config`. Apply edits: `herdr server reload-config`.

[theme]
# Everforest Dark Hard, the same palette as Ghostty. Herdr has no theme files: a theme is a
# built-in base plus `[theme.custom]` overrides. Every one of Herdr's tokens is set below, so
# the base only supplies defaults for tokens a future Herdr might add.
#
# Not `terminal`. That theme is a fixed table of ANSI colour names, not a copy of the host
# palette: it paints the active sidebar row, tab pills and separators in bright black (slot 8)
# and muted text in slots 7 and 15. Everforest maps those slots to light sage and cream, so
# the highlights came out lighter than the text on them.
name = "catppuccin"

[theme.custom]
# Surfaces, one Everforest bg step per role. The terminal background is bg_dim.
panel_bg = "#1e2326"       # bg_dim: tab row, mode bar, popups; also the text on accent fills
sidebar_bg = "reset"       # the sidebar keeps the terminal background
surface0 = "#2e383c"       # bg1: inactive tab pills, text inputs, cancel buttons
active_row_bg = "#374145"  # bg2: focused space row, focused agent row
surface1 = "#414b50"       # bg3: dragged row, divider rules
surface_dim = "#495156"    # bg4: sidebar and header separators, scrollbar tracks
selection_bg = "#4c3743"   # bg_visual: navigate-mode cursor row (Ghostty's selection colour)
# Text, darkest to lightest. Herdr assumes overlay0 < overlay1 < subtext0 < text.
overlay0 = "#7a8478"       # grey0: inactive tab labels, headers, unfocused pane borders
overlay1 = "#859289"       # grey1: clock and battery, popup body text
subtext0 = "#9da9a0"       # grey2: unfocused space and agent labels
text = "#d3c6aa"           # fg: focused labels, popup titles
# Accents.
accent = "#a7c080"         # green: active tab, focused pane border, selected rows, buttons
mauve = "#d699b6"          # purple: branch name on the focused space row
green = "#a7c080"          # idle agent
yellow = "#dbbc7f"         # working agent
red = "#e67e80"            # blocked agent, destructive buttons
teal = "#83c092"           # aqua: done agent
blue = "#7fbbb3"           # finished toast
peach = "#e69875"          # orange: unused by Herdr 0.9.1

[ui]
# Tab row at the bottom. Always shown: hiding it for a single tab also hides the
# battery and clock. New tabs get a generated name instead of a prompt (rename later
# with prefix+shift+t).
tab_bar_position = "bottom"
prompt_new_tab_name = false

# Right-hand status area of the tab row: battery (plain text; Herdr strips styles)
# and a clock. Values resolve on the server, so a remote session shows its own.
# The status block is drawn flush to the right edge, so the trailing text entry is
# padding: with the separator before it, two columns. Datetime output is trimmed,
# so a trailing space in the clock format would not work.
tab_bar_right = [
  { type = "command", command = "~/scripts/battery/battery-status", interval_seconds = 60, timeout_seconds = 5 },
  { type = "datetime", format = "%-I:%M %p" },
  { type = "text", text = " " },
]

[ui.sidebar.agents]
# One row per agent: state dot, machine, space, tab. The default second row that
# names the agent program ("claude") is dropped.
rows = [["state_icon", "machine", "workspace", "tab"]]

[ui.toast]
# Agent finished / needs input: ask the outer terminal (Ghostty) to post a desktop
# notification. Works over SSH too. Popups are suppressed for the active tab.
delivery = "terminal"

[worktrees]
# New worktrees land at ~/code/<repo>/<branch-slug>, the existing sibling layout
# next to each repo's .bare checkout.
directory = "~/code"

[keys]
# Direct (prefix-free) chords added alongside the prefix defaults, which stay in the
# arrays. Herdr consumes a direct chord in every pane, so that key never reaches the
# shell or the app running in it. `ctrl+b ?` lists what is active.

# Worktrees. remove_worktree asks for confirmation, runs `git worktree remove`, and
# closes the worktree's workspace in the same step. It never deletes the branch.
# Ctrl+Shift+d (a [[keys.command]] popup below) does the same for several at once.
new_worktree = ["prefix+shift+g", "ctrl+w"]
remove_worktree = "ctrl+d"

# Agents, in agent-panel order (grouped by workspace; `ui.agent_panel_sort`): k moves up,
# j moves down. Each press focuses the previous/next agent shown in the panel.
previous_agent = "ctrl+k"
next_agent = "ctrl+j"

# Workspaces, in sidebar order: k moves up, j moves down. Ctrl+Shift+<letter> reaches Herdr
# as a chord distinct from Ctrl+<letter> for the same reason Ctrl+Shift+S does below.
previous_workspace = "ctrl+shift+k"
next_workspace = "ctrl+shift+j"

# Tabs.
new_tab = ["prefix+c", "ctrl+t"]
close_tab = ["prefix+shift+x", "ctrl+x"]
previous_tab = ["prefix+p", "ctrl+h"]
next_tab = ["prefix+n", "ctrl+l"]

# Panes.
focus_pane_left = ["prefix+h", "alt+h"]
focus_pane_down = ["prefix+j", "alt+j"]
focus_pane_up = ["prefix+k", "alt+k"]
focus_pane_right = ["prefix+l", "alt+l"]
swap_pane_left = ["prefix+shift+h", "alt+shift+h"]
swap_pane_down = ["prefix+shift+j", "alt+shift+j"]
swap_pane_up = ["prefix+shift+k", "alt+shift+k"]
swap_pane_right = ["prefix+shift+l", "alt+shift+l"]
split_vertical = ["prefix+v", "alt+s"]              # split right
split_horizontal = ["prefix+minus", "alt+shift+s"]  # split down
zoom = ["prefix+z", "alt+f"]
close_pane = ["prefix+x", "alt+x"]
edit_scrollback = ["prefix+e", "alt+e"]

# Session.
detach = ["prefix+q", "ctrl+q"]
reload_config = ["prefix+shift+r", "ctrl+r"]
open_notification_target = ["prefix+o", "ctrl+u"]

# Ctrl+Shift+S: fzf file search in the focused pane. Terminals encode Ctrl+Shift+S
# and Ctrl+S as the same byte (0x13), so zsh cannot tell them apart. Herdr can, so
# this types the CSI u sequence for ctrl+shift+s into the pane and .zshrc binds
# that sequence to fzf-file-widget. Runs via /bin/sh -lc from the pane's cwd.
[[keys.command]]
key = "ctrl+shift+s"
type = "shell"
description = "fzf file search (types ESC [115;6u into the focused pane)"
command = "\"${HERDR_BIN_PATH:-herdr}\" pane send-text \"$HERDR_ACTIVE_PANE_ID\" \"$(printf '\\033[115;6u')\""

# Ctrl+Shift+D: multi-select worktree removal across ~/code. A popup is a
# session-modal terminal over the current tab that closes when its command
# exits. Popups run through a non-login /bin/sh -c from the focused pane's
# directory, so the script sets its own PATH. Sizes include the border.
[[keys.command]]
key = "ctrl+shift+d"
type = "popup"
description = "remove worktrees (multi-select picker)"
command = "~/scripts/herdr/worktree-remove"
width = "90%"
height = "80%"
